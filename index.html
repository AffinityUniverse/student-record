<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Record</title>

<!-- style.css 연결 -->
<link rel="stylesheet" href="./style.css">
</head>
<body>

  <!--
    ============================================================
    #canvas-wrapper : 화면 중앙에 캔버스를 배치하기 위한 바깥 래퍼
    #canvas         : 실제 디자인이 그려지는 영역 (1080 x 1440px 기준)
                       이 안의 모든 요소는 absolute + % 좌표로 배치되어
                       #canvas 크기가 줄어들거나 커져도 비율이 유지된다.
    ============================================================
  -->
  <div id="canvas-wrapper">
    <div id="canvas">

      <!-- 1) 배경 이미지 (가장 아래 레이어, z-index 가장 낮음) -->
      <!-- src는 script.js에서 base64 데이터로 채워진다 (file://에서도 다운로드가 되게 하기 위함) -->
      <img id="background-image" src="./Main.png" alt="배경 이미지">

      <!-- 2) 사용자 업로드 이미지 영역 (배경 위, 도장 아래) -->
      <!-- upload-frame : 잘림 처리를 담당하는 컨테이너 (overflow: hidden) -->
      <div id="upload-frame">
        <!-- 실제 업로드된 이미지가 여기에 들어간다. 처음에는 비어있음 -->
        <img id="uploaded-image" src="" alt="업로드한 이미지" style="display:none;">
        <!-- 이미지가 없을 때 안내 문구 -->
        <div id="upload-placeholder">이미지를 업로드해주세요</div>
      </div>

      <!-- 3) 도장이 표시되는 자리 (가장 위 레이어) -->
      <!-- (이번 프로젝트는 테이프가 없으므로 업로드 이미지 다음 바로 도장이 온다) -->
      <div id="stamp-frame">
        <img id="stamp-image" src="" alt="도장 이미지" style="display:none;">
      </div>

    </div>
  </div>

  <!--
    ============================================================
    컨트롤 버튼 영역 (캔버스 바깥, 화면 하단 고정 UI)
    - 이미지 업로드 버튼
    - 여자 도장 버튼
    - 남자 도장 버튼
    - 다운로드 버튼
    ============================================================
  -->
  <div id="controls">
    <!-- 실제 파일 선택창은 숨기고, 예쁜 버튼(label)으로 클릭을 대신 받는다 -->
    <label for="file-input" class="btn btn-upload">이미지 업로드</label>
    <input type="file" id="file-input" accept="image/*" hidden>

    <button id="btn-female" class="btn btn-female">여자 도장</button>
    <button id="btn-male" class="btn btn-male">남자 도장</button>

    <!-- 완성된 합성 이미지를 다운로드하는 버튼 -->
    <button id="btn-download" class="btn btn-download">이미지 다운로드</button>
  </div>

  <!-- 이미지들을 base64로 미리 변환해서 담아둔 파일 (다운로드가 어떤 환경에서든 되게 하기 위함) -->
  <!-- 반드시 script.js보다 먼저 불러와야 한다 -->
  <script src="./script.js"></script>
  
</body>
</html>
